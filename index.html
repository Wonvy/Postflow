<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // 手机（触屏、屏幕窄）：整体放大一点，字和按钮都适合手指；同时不让 iPhone 点输入框时自动放大页面
      try {
        if (matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 600) {
          document
            .querySelector("meta[name=viewport]")
            .setAttribute("content", "width=device-width, initial-scale=1.15, maximum-scale=1.15, viewport-fit=cover");
        }
      } catch (e) {}
    </script>
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 手机「添加到主屏幕」：图标和全屏打开。清单由服务端生成（带着访问密钥时直接带密钥打开），要带上 Cookie -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Postflow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Postflow</title>
    <script>
      // 在样式加载前就定好主题，避免启动时闪一下
      try {
        var saved = JSON.parse(localStorage.getItem("postflow.ui") || "{}").state || {};
        var theme = saved.theme || "system";
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 太旧的浏览器（macOS 上就是太旧的 Safari，桌面应用用的也是它）跑不动界面，与其一片空白，不如说清楚。
      // 界面用到的最新的东西要 Safari 15.4（Array.prototype.at 也是那一版加的）
      try {
        if (!Array.prototype.at) {
          var box = document.getElementById("root");
          box.setAttribute(
            "style",
            "max-width:420px;margin:20vh auto;padding:0 24px;font:15px/1.7 -apple-system,system-ui,sans-serif;text-align:center",
          );
          box.textContent =
            "Postflow 需要 Safari 15.4 或更新的版本。请在「系统设置 → 软件更新」里更新 macOS 和 Safari 后再打开。" +
            " Postflow needs Safari 15.4 or later. Please update macOS and Safari in System Settings → Software Update, then open it again.";
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
