[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.39"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[workspace.dependencies]
postflow-store = { path = "crates/store" }
postflow-feed = { path = "crates/feed" }
postflow-core = { path = "crates/core" }
postflow-web = { path = "crates/web" }

[profile.dev.package."*"]
# 依赖用优化构建，开发时抓取与解析不至于太慢
opt-level = 1

[profile.dev.package.fxtranslate]
# 翻译推理全是数值计算，不优化要慢几十倍
opt-level = 3

[profile.dev.package.postflow-speech]
# 解码出来的音频要逐个样本混成单声道、喂给人声检测，不优化的话开发时转写会慢好几倍
opt-level = 3

[profile.dev.package.opus-decoder]
# 照着 C 版 libopus 移植的，有些移位按 C 的习惯会「溢出」（正式版编译本来就不检查）；
# 开发和测试时也不检查，免得调试版一解 Opus 就停下。解码要快，也开优化
opt-level = 3
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
