[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.25"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[workspace.dependencies]
postflow-store = { path = "crates/store" }
postflow-feed = { path = "crates/feed" }
postflow-core = { path = "crates/core" }
postflow-web = { path = "crates/web" }

[profile.dev.package."*"]
# 依赖用优化构建，开发时抓取与解析不至于太慢
opt-level = 1

[profile.dev.package.fxtranslate]
# 翻译推理全是数值计算，不优化要慢几十倍
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
