name: Release

# 推送 v 开头的标签（例如 v0.2.0）时，在三个平台上打包，全部成功后发布 Release。
# 发版用 `npm run release -- 0.2.0`，它会改好版本号、提交并打标签。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要重新打包的标签，例如 v0.2.0（必须已经推送到仓库）
        required: true

permissions:
  contents: write

# 同一个标签不要同时跑两次，免得往同一个 Release 里重复上传
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: 创建草稿 Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: 确认更新签名密钥已配置
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # 应用里的在线更新只认用这把私钥签过名的安装包，缺了它打包会在最后一步失败
          if [ -z "$KEY" ]; then
            echo "::error::仓库还没有配置 TAURI_SIGNING_PRIVATE_KEY。到 Settings → Secrets and variables → Actions 里添加，内容是 ~/.tauri/postflow-updater.key 这个文件的全文。"
            exit 1
          fi

      - name: 核对标签和版本号
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::标签 $TAG 和 package.json 里的版本 $version 对不上。请用 npm run release -- <版本号> 发版。"
            exit 1
          fi

      - name: 创建或沿用草稿
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同一个标签重新跑时，沿用已有的草稿，不重复创建
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            version="${TAG#v}"
            sed "s/__VERSION__/$version/g" .github/release-notes.md > notes.md
            # 附上自上个版本以来的提交与合并请求列表
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body >> notes.md || true
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                   -f tag_name="$TAG" -f name="Postflow $TAG" \
                   -F body=@notes.md -F draft=true \
                   -F prerelease=$([[ "$TAG" == *-* ]] && echo true || echo false) \
                   --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: 打包 (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # 一个安装包同时支持 Apple 芯片和 Intel
          - name: macOS
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            rust_targets: ""
            args: ""
          # 用较老的 Ubuntu 打包，生成的程序在更多发行版上能运行
          - name: Linux
            os: ubuntu-22.04
            rust_targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - run: npm ci

      # 除了安装包，还会生成签过名的更新包和 latest.json，应用里的在线更新靠它们工作
      - name: 打包并上传到 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          retryAttempts: 1
          uploadUpdaterJson: true
          # Windows 用 setup.exe 更新，安装时只显示进度条，不需要用户点下一步
          updaterJsonPreferNsis: true

  publish:
    name: 发布 Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      # 草稿阶段上传的文件还没有公开地址，latest.json 里写的是 api.github.com 的地址。
      # 那个地址对每个 IP 每小时只给 60 次匿名请求，用户多的网络里在线更新会下载失败，
      # 所以发布前把它们换成 github.com 的公开下载地址。
      - name: 把 latest.json 里的下载地址换成公开地址
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv' > assets.tsv
          latest_id=$(awk -F'\t' '$2 == "latest.json" {print $1}' assets.tsv)
          if [ -z "$latest_id" ]; then
            echo "::error::Release 里没有 latest.json，在线更新会找不到这个版本。"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$latest_id" > latest.json
          python3 - <<'EOF'
          import csv, json, os
          repo, tag = os.environ["GITHUB_REPOSITORY"], os.environ["TAG"]
          names = {row[0]: row[1] for row in csv.reader(open("assets.tsv"), delimiter="\t")}
          prefix = f"https://api.github.com/repos/{repo}/releases/assets/"
          data = json.load(open("latest.json"))
          for platform in data["platforms"].values():
              url = platform["url"]
              if url.startswith(prefix):
                  name = names[url[len(prefix):]]
                  platform["url"] = f"https://github.com/{repo}/releases/download/{tag}/{name}"
          json.dump(data, open("latest.json", "w"), indent=2)
          print(json.dumps({k: v["url"] for k, v in data["platforms"].items()}, indent=2))
          EOF
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$latest_id"
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" \
            > /dev/null

      - name: 去掉草稿状态
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq .html_url
