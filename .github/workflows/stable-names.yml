name: Stable download names

# 给一个已经发布的版本补上不带版本号的安装包（Postflow-macOS.dmg 等），README 的下载链接靠它们。
# 新版本在 Release 流程里会自动加上，这里只用来补以前的版本：在 Actions 页面手动运行，填标签。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的标签，例如 v0.1.30
        required: true

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          bash .github/scripts/stable-names.sh "$id"
