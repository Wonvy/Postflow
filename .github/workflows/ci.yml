name: CI

on:
  push:
    branches: [main]
  pull_request:

# 拉取请求推了新提交时取消旧的检查。main 上每个提交各自一组，谁也不取消谁：
# 发版提交后面紧跟着推了别的提交，它的检查也会跑完，不会显示成被取消。
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: 检查与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Tauri 在 Linux 上依赖系统的 WebKitGTK
      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - run: npm ci

      # 先构建界面：Tauri 外壳在编译时要求 dist 目录存在
      - name: 类型检查并构建界面
        run: npm run build

      - name: 界面逻辑测试
        run: npm run test:ui

      - name: 检查格式
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 真的跑一次语音识别（crates/speech/tests/recognize.rs）：下载模型、解码 Opus、识别、分说话人。
      # macOS 上开发时天天在跑，这里补上 Linux 和 Windows：设了 POSTFLOW_SPEECH_SMOKE 它才跑。
      # 模型缓存起来，模型目录变了才重新下载。
      - name: 缓存语音识别模型
        if: runner.os != 'macOS'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/speech-smoke
          key: speech-smoke-${{ runner.os }}-${{ hashFiles('public/catalog/speech.json') }}

      # 识别测试和别的测试在同一次 cargo test 里跑，不另外编译：只编一部分（-p 或 --test）时依赖的特性
      # 不一样，sherpa-onnx-sys 会重新编，而它下载的预编译静态库（target/sherpa-onnx-prebuilt）已经被
      # rust-cache 清掉了，链接会失败。
      # 失败时把输出的最后几十行写成这次运行的注释：任务日志要登录 GitHub 才能看，注释谁都能看。
      - name: 测试
        shell: bash
        env:
          POSTFLOW_SPEECH_SMOKE: ${{ runner.os != 'macOS' && format('{0}/speech-smoke', runner.temp) || '' }}
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee test.log; then
            printf '::error title=测试失败 (%s)::' "$RUNNER_OS"
            tail -n 60 test.log | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }'
            echo
            exit 1
          fi
          # 两套 C 运行库混在一起（见 crates/speech/build.rs）：标出来，不用登录看日志也知道
          if grep -q "LNK4098" test.log; then
            printf '::warning title=混用了两套 C 运行库 (%s)::' "$RUNNER_OS"
            grep -B1 "LNK4098" test.log | tr -d '\r' | head -n 20 | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }'
            echo
          fi
