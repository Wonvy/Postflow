name: CI

on:
  push:
    branches: [main]
  pull_request:

# 拉取请求推了新提交时取消旧的检查。main 上每个提交各自一组，谁也不取消谁：
# 发版提交后面紧跟着推了别的提交，它的检查也会跑完，不会显示成被取消。
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: 检查与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Tauri 在 Linux 上依赖系统的 WebKitGTK
      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - run: npm ci

      # 先构建界面：Tauri 外壳在编译时要求 dist 目录存在
      - name: 类型检查并构建界面
        run: npm run build

      - name: 界面逻辑测试
        run: npm run test:ui

      - name: 检查格式
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace
