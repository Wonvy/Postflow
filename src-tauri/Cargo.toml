[package]
name = "postflow-desktop"
description = "Postflow 桌面与移动端外壳"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "postflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
postflow-core = { workspace = true }
# unstable：阅读区的原网页模式要在主窗口里再放一个网页视图（Window::add_child）
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 新邮件的系统通知
tauri-plugin-notification = "=2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1.54.1", features = ["sync", "net"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
# 在浏览器中使用：桌面应用自己提供网页版（见 web_access.rs）
postflow-web = { workspace = true }
