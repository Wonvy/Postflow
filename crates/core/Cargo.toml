[package]
name = "shibapost-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures = "0.3.34"
gethostname = "1.1.0"
keyring = "4.2.0"
notify = "8"
shibapost-ai = { version = "0.1.0", path = "../ai" }
shibapost-feed = { workspace = true }
shibapost-mail = { version = "0.1.0", path = "../mail" }
shibapost-speech = { version = "0.1.0", path = "../speech" }
shibapost-store = { workspace = true }
shibapost-translate = { version = "0.1.0", path = "../translate" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8.9"
shibapost-testkit = { path = "../testkit" }
tempfile = "3.27.0"

[build-dependencies]
# 见 build.rs：Windows 上和桌面应用用同一套 C 运行库
static_vcruntime = "3.0.0"
