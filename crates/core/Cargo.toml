[package]
name = "postflow-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
futures = "0.3.34"
gethostname = "1.1.0"
keyring = "4.2.0"
notify = "8"
postflow-ai = { version = "0.1.0", path = "../ai" }
postflow-feed = { version = "0.1.0", path = "../feed" }
postflow-mail = { version = "0.1.0", path = "../mail" }
postflow-store = { version = "0.1.0", path = "../store" }
postflow-translate = { version = "0.1.0", path = "../translate" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8.9"
postflow-testkit = { path = "../testkit" }
tempfile = "3.27.0"
