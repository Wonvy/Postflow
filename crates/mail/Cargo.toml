[package]
name = "postflow-mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ammonia = "4.2.5"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
encoding_rs = "0.8.44"
futures = "0.3.34"
hickory-resolver = "0.26.3"
mail-builder = { version = "=0.4.4", default-features = false }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
native-tls = "0.2.14"
rand = "0.10.4"
reqwest = "0.13.5"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "time", "io-util", "macros", "sync", "rt"] }
tokio-native-tls = "0.3.1"
tokio-rustls = "0.26.6"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
postflow-testkit = { path = "../testkit" }
tokio = { version = "1.54.1", features = ["full"] }
