[package]
name = "postflow-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
# 语音识别的运行库（Apache-2.0）。编译时从它的 GitHub Release 下载预编译的静态库链进程序，
# 不用另外带动态库。模型不在这里：用户装好以后按需下载，见 catalog.rs。
sherpa-onnx = "2.0.1"
# 纯 Rust 的音频解码：播客常见的 MP3、AAC（M4A/MP4）、Vorbis、FLAC、WAV。Opus 还不支持。
symphonia = { version = "0.6.1", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
